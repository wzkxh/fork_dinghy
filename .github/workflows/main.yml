name: Build FM-1 Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 curl tar

      - name: Download JieLi Toolchain
        run: |
          mkdir -p ~/.jieli
          # Downloads the official JieLi Linux pi32 toolchain
          curl -sSL https://pkgman.jieliapp.com/doc/pi32/pi32-linux-x86_64-latest.tar.gz | tar -xz -C ~/.jieli || true
          echo "JIELI_TOOLCHAIN=$HOME/.jieli" >> $GITHUB_ENV

      - name: Run Build
        run: |
          make

      - name: Upload .fwsc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-firmware
          path: |
            *.fwsc
            build/*.fwsc
