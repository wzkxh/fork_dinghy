name: Build Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Environment & Compile
        run: |
          make

      - name: Upload .fwsc Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-firmware
          path: |
            *.fwsc
            build/*.fwsc
