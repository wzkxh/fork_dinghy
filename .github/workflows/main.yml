name: Build FM-1 Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 curl tar

      - name: Setup JieLi Toolchain
        run: |
          mkdir -p $HOME/jieli-toolchain
          curl -sSL https://raw.githubusercontent.com/zvenson/dinghy/main/tools/setup_toolchain.sh | bash || true
          echo "$HOME/jieli-toolchain/bin" >> $GITHUB_PATH

      - name: Build Firmware
        run: |
          make -j$(nproc)

      - name: Upload .fwsc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-firmware
          path: |
            *.fwsc
            build/*.fwsc
